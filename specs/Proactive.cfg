\* Основная модель: два прогона, два ключа (второй — срочный отправитель), два слота Brief,
\* два дня, три прогона, два роста непрочитанного, одно падение, watchCapPerDay = 1.
\* Шаг Tick — 8 минут: staleMs 40 мин -> Stale = 5, timeoutMs + killGraceMs -> MaxRun = 4.
\* NowAfterLock = TRUE — правка спеки: now прогона берётся сразу после взятия замка
\* (Proactive-nowfirst.cfg показывает, что ломается без неё).
\* InsightClaimFirst = TRUE — заявка Insight до хода, KeepInsight = TRUE — каждая запись переносит
\* insight.day (Proactive-noinsightclaim.cfg и Proactive-dropinsight.cfg показывают, что ломается без них).
CONSTANTS
  Procs = {p1, p2}
  Keys = {1, 2}
  Urgent = {2}
  NSlots = 2
  MaxDays = 2
  MaxRuns = 3
  MaxArrive = 2
  MaxCrashes = 1
  Cap = 1
  Stale = 5
  MaxRun = 4
  Locking = TRUE
  ClaimFirst = TRUE
  Capped = TRUE
  NowAfterLock = TRUE
  InsightClaimFirst = TRUE
  KeepInsight = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoDoubleTake OneBriefPerSlot WakesCapped OneRun OneInsightPerDay
