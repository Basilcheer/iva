\* Свидетель: запись Brief или Watch теряет поле spark (писатель не переносит его из памяти). ОБЯЗАН нарушать OneSparkPerDay (5): прогон Watch после Spark стирает заявку дня, и следующий прогон ведёт Spark ещё раз.
