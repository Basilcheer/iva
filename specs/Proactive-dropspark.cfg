  MaxRuns = 3
  MaxArrive = 2
  MaxCrashes = 1
  Cap = 1
  Stale = 5
  MaxRun = 4
  Locking = TRUE
  ClaimFirst = TRUE
  Capped = TRUE
  NowAfterLock = TRUE
  SparkClaimFirst = TRUE
  KeepSpark = FALSE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK NoDoubleTake OneBriefPerSlot WakesCapped OneRun OneSparkPerDay
