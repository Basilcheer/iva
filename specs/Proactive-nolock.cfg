\* Свидетель: без замка. ОБЯЗАН нарушать OneRun (4); без него — NoDoubleTake (1); без них и WakesCapped (3) — OneBriefPerSlot (2): два прогона читают одно briefDone и оба ведут Brief (proactive-check.sh гоняет все три, у каждой строки снят и OneSparkPerDay); без OneRun, NoDoubleTake, WakesCapped и OneBriefPerSlot — OneSparkPerDay (5): два прогона читают один spark.day и оба ведут Spark.
