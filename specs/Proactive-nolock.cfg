  MaxRun = 4
  Locking = FALSE
  ClaimFirst = TRUE
  Capped = TRUE
  NowAfterLock = TRUE
  SparkClaimFirst = TRUE
  KeepSpark = TRUE
SPECIFICATION Spec
VIEW View
