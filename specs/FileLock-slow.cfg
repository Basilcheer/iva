\* 3 процесса, секция не короче staleMs, колбэк сердцебиения запаздывает: Period + MaxLag < Stale, MaxSection < MaxHold — все инварианты. Живость на 3 процессах в этих границах не укладывается в память TLC (55 млн вершин графа), она проверена в FileLock.cfg, FileLock-2p.cfg и FileLock-deadline.cfg.
CONSTANTS
  Procs = {1, 2, 3}
  MaxTries = 2
  MaxCrashes = 1
  Stale = 3
  MaxSection = 3
  Deadline = FALSE
  Heartbeat = TRUE
  Period = 1
  MaxLag = 1
  MaxHold = 4
SPECIFICATION Spec
INVARIANTS TypeOK MutualExclusion MutualExclusionOwned NoSuccessorRemoval CrashWindowSafe
