\* 3 процесса, секция не короче staleMs, колбэк сердцебиения запаздывает: Period + MaxLag < Stale, MaxSection < MaxHold — только безопасность (все инварианты). Живость на 3 процессах в этих границах не укладывается в память TLC, она проверена на 2 процессах (FileLock-2p.cfg, FileLock-deadline.cfg) и на 3 с быстрой секцией (FileLock.cfg, с оговоркой про границу MaxTries).
CONSTANTS
  Procs = {1, 2, 3}
  MaxTries = 2
  MaxCrashes = 1
  Stale = 3
  MaxSection = 3
  Deadline = FALSE
  Heartbeat = TRUE
  Period = 1
  MaxLag = 1
  MaxHold = 4
SPECIFICATION Spec
INVARIANTS TypeOK MutualExclusion MutualExclusionOwned NoSuccessorRemoval CrashWindowSafe
