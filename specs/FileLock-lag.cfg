\* Граница контракта: event loop держателя задерживает колбэк на MaxLag >= Stale - Period — ожидаемая кража (нарушение MutualExclusion).
CONSTANTS
  Procs = {1, 2}
  MaxTries = 2
  MaxCrashes = 1
  Stale = 3
  MaxSection = 4
  Deadline = FALSE
  Heartbeat = TRUE
  Period = 1
  MaxLag = 2
  MaxHold = 5
SPECIFICATION Spec
INVARIANTS TypeOK MutualExclusion
