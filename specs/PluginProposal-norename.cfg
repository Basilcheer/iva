\* Свидетель: тап копирует предложение, а не забирает его rename. ОБЯЗАН нарушать
\* OneInstaller: два тапа запускают два установщика. Часы стоят и правок нет. На той же
\* глубине ломается и SweepSparesTaken (возврат общей копии из-под второго тапа), поэтому
\* plugin-proposal-check.sh проверяет OneInstaller без него.
CONSTANTS
  NProps = 2
  NTaps = 2
  TTL = 2
  MaxClock = 0
  MaxTamper = 0
  ExclusiveTake = FALSE
  StampOnTake = TRUE
  StagedCheck = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneInstaller OnlyButtonBytes SweepSparesTaken
