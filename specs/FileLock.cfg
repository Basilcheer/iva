\* 3 процесса, секция быстрее тика (MaxSection = 0): все инварианты (3 — контракт) и живость. Beat здесь не исполняется (секция короче периода) — зависимость от сердцебиения доказывает FileLock-witness.cfg. Граница MaxTries на 3 процессах достижима (NoBounded не включён): живость — с оговоркой «пока вызов не упёрся в границу модели».
CONSTANTS
  Procs = {1, 2, 3}
  MaxTries = 2
  MaxCrashes = 1
  Stale = 2
  MaxSection = 0
  Deadline = FALSE
  Heartbeat = TRUE
  Period = 1
  MaxLag = 0
  MaxHold = 1
SPECIFICATION Spec
INVARIANTS TypeOK MutualExclusion MutualExclusionOwned NoSuccessorRemoval CrashWindowSafe
PROPERTIES Termination EventuallyTaken
